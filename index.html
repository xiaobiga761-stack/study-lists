<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b62c4">
<title>小涛的备考清单</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; padding: 28px 16px 40px; background: #f5f6f8; color: #1b1f24;
  font: 17px/1.65 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
.wrap { max-width: 560px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: #6b7683; font-size: 13px; margin: 0 0 22px; }
a.card {
  display: block; background: #fff; border: 1px solid #e4e8ee; border-radius: 14px;
  padding: 18px 16px; margin: 0 0 12px; text-decoration: none; color: inherit;
}
a.card:active { background: #eef3fa; }
.t { font-size: 18px; font-weight: 650; margin-bottom: 4px; }
.d { font-size: 13px; color: #6b7683; }
.tip { font-size: 13px; color: #6b7683; margin-top: 18px; }
@media (prefers-color-scheme: dark) {
  body { background: #14171a; color: #e7ebef; }
  a.card { background: #1d2126; border-color: #2c3238; }
  .sub, .d, .tip { color: #9aa5b1; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1>备考清单</h1>
  <p class="sub">浙江专升本 · 高数与英语 · 2027 年 4 月</p>

  <a class="card" href="math.html">
    <div class="t">高等数学 · 题型清单</div>
    <div class="d">六章 92 个题型，按章打勾：见过 / 会做 / 用对</div>
  </a>

  <a class="card" href="english.html">
    <div class="t">英语 · 章节清单</div>
    <div class="d">20 个语法章节，每章列考点与考察方式</div>
  </a>

  <p class="tip">在 Safari 里点"分享 → 添加到主屏幕"，以后点图标就能打开，不用记网址。<br>
  勾选存在这台设备上；换设备或清了浏览器记录会清零，进度可以点页面里的"导出进度"发我。</p>
</div>
</body>
</html>
